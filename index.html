<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>welcome to my g@l3ri4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --panel: #f3f3f3;
    --text: #000000;
    --muted: #8a8a8a;
    --line: #e4e4e4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    padding: 56px 24px 140px;
  }
  header { max-width: 1100px; margin: 0 auto 48px; }
  h1 {
    font-weight: 500;
    font-size: clamp(1.4rem, 4vw, 2rem);
    letter-spacing: -0.02em;
    margin: 0 0 8px;
    line-height: 1.1;
  }
  header p { margin: 0; color: var(--muted); font-size: .95rem; max-width: 52ch; }

  .grid {
    max-width: 1100px;
    margin: 0 auto;
    columns: 3 280px;
    column-gap: 24px;
  }
  .photo {
    display: block;
    width: 100%;
    margin: 0 0 28px;
    padding: 0;
    border: 0;
    background: transparent;
    break-inside: avoid;
    cursor: pointer;
    position: relative;
    text-align: left;
    color: inherit;
    font: inherit;
    outline: 2px solid transparent;
    outline-offset: 4px;
    transition: outline-color .2s;
  }
  .photo:focus-visible { outline-color: var(--muted); }
  .photo.playing { outline-color: var(--text); }
  .photo img, .photo .ph { display: block; width: 100%; height: auto; }
  .photo .ph {
    aspect-ratio: 4 / 5;
    display: grid;
    place-items: center;
    background: var(--panel);
    color: var(--muted);
    font-size: .85rem;
    padding: 16px;
    text-align: center;
  }
  .photo .cap {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 10px 0 0;
    font-size: .9rem;
  }
  .photo .cap span:last-child { color: var(--muted); font-size: .85rem; }
  .photo.playing .cap span:last-child { color: var(--text); }

  /* barras de sonido, solo visibles mientras suena */
  .bars { display: none; gap: 3px; align-items: flex-end; height: 14px; }
  .photo.playing .bars { display: flex; }
  .bars i {
    width: 2px; background: var(--text);
    animation: bar 0.9s ease-in-out infinite;
  }
  .bars i:nth-child(2) { animation-delay: .2s; }
  .bars i:nth-child(3) { animation-delay: .4s; }
  @keyframes bar { 0%,100% { height: 3px; } 50% { height: 14px; } }
  .photo.paused .bars i { animation-play-state: paused; }

  /* barra inferior */
  .player {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    border-top: 1px solid var(--line);
    padding: 14px 24px calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 12px;
    transform: translateY(100%);
    transition: transform .25s;
  }
  .player.show { transform: none; }
  .player .info { flex: 1; min-width: 0; }
  .player .info b { display: block; font-weight: 500; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player .info small { color: var(--muted); }
  .player button {
    background: var(--text); color: var(--bg);
    border: 1px solid var(--text); border-radius: 999px;
    padding: 8px 18px; font: inherit; font-size: .85rem; cursor: pointer;
  }
  .player button.ghost { background: transparent; color: var(--text); border-color: var(--line); }
  .player button:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>welcome to my g@l3ri4</h1>
  <p>Haz clic en una foto para escuchar su canción. Haz clic otra vez para pausar.</p>
</header>

<main class="grid" id="grid"></main>

<div class="player" id="player" role="region" aria-label="Reproductor">
  <div class="info">
    <b id="np-title"></b>
    <small id="np-status"></small>
  </div>
  <button id="np-toggle" type="button">Pausar</button>
  <button id="np-stop" type="button" class="ghost">Detener</button>
</div>

<script>
  /* ============================================================
     EDITA ESTA LISTA: una entrada por foto.
     - foto:   ruta de la imagen (ej. "fotos/playa.jpg")
     - cancion: ruta del audio (ej. "musica/playa.mp3")
     - titulo: texto que se muestra bajo la foto
     - artista: nombre de la canción / artista (opcional)
     ============================================================ */
  const FOTOS = [
    { foto: "fotos/IMG_7900.jpg", cancion: "musica/cancion1.mp3", titulo: "Foto 1", artista: "Canción 1" },
    { foto: "fotos/foto2.jpg", cancion: "musica/cancion2.mp3", titulo: "Foto 2", artista: "Canción 2" },
    { foto: "fotos/foto3.jpg", cancion: "musica/cancion3.mp3", titulo: "Foto 3", artista: "Canción 3" },
    { foto: "fotos/foto4.jpg", cancion: "musica/cancion4.mp3", titulo: "Foto 4", artista: "Canción 4" },
    { foto: "fotos/foto5.jpg", cancion: "musica/cancion5.mp3", titulo: "Foto 5", artista: "Canción 5" },
    { foto: "fotos/foto6.jpg", cancion: "musica/cancion6.mp3", titulo: "Foto 6", artista: "Canción 6" }
  ];

  const grid = document.getElementById("grid");
  const player = document.getElementById("player");
  const npTitle = document.getElementById("np-title");
  const npStatus = document.getElementById("np-status");
  const npToggle = document.getElementById("np-toggle");
  const npStop = document.getElementById("np-stop");

  const audio = new Audio();
  audio.preload = "none";
  let current = -1;
  const cards = [];

  FOTOS.forEach((item, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "photo";
    btn.setAttribute("aria-label", "Reproducir " + item.titulo);

    const img = document.createElement("img");
    img.src = item.foto;
    img.alt = item.titulo;
    img.loading = "lazy";
    img.onerror = () => {
      const ph = document.createElement("div");
      ph.className = "ph";
      ph.textContent = "Falta la imagen: " + item.foto;
      img.replaceWith(ph);
    };

    const cap = document.createElement("div");
    cap.className = "cap";
    cap.innerHTML = '<span></span><span></span><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>';
    cap.children[0].textContent = item.titulo;
    cap.children[1].textContent = item.artista || "";

    btn.append(img, cap);
    btn.addEventListener("click", () => play(i));
    grid.appendChild(btn);
    cards.push(btn);
  });

  function refresh() {
    cards.forEach((c, i) => {
      c.classList.toggle("playing", i === current);
      c.classList.toggle("paused", i === current && audio.paused);
    });
    if (current >= 0) {
      npToggle.textContent = audio.paused ? "Reanudar" : "Pausar";
      npStatus.textContent = audio.paused ? "En pausa" : "Reproduciendo";
    }
  }

  function play(i) {
    if (i === current) {                 // misma foto: pausar / reanudar
      audio.paused ? audio.play() : audio.pause();
      refresh();
      return;
    }
    current = i;                         // otra foto: cambiar de canción
    audio.src = FOTOS[i].cancion;
    npTitle.textContent = FOTOS[i].titulo + (FOTOS[i].artista ? " · " + FOTOS[i].artista : "");
    player.classList.add("show");
    audio.play().catch(() => {
      npStatus.textContent = "No encuentro el audio: " + FOTOS[i].cancion;
    });
    refresh();
  }

  npToggle.addEventListener("click", () => {
    if (current < 0) return;
    audio.paused ? audio.play() : audio.pause();
  });
  npStop.addEventListener("click", () => {
    audio.pause();
    audio.removeAttribute("src");
    current = -1;
    player.classList.remove("show");
    refresh();
  });
  audio.addEventListener("play", refresh);
  audio.addEventListener("pause", refresh);
  audio.addEventListener("ended", () => { npStatus.textContent = "Terminó"; refresh(); });
  audio.addEventListener("error", () => {
    if (current >= 0) npStatus.textContent = "No encuentro el audio: " + FOTOS[current].cancion;
  });
</script>
</body>
</html>
