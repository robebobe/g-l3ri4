<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>welcome to my g@l3ri4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #fff; color: #fff;
    font-family: "Inter", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; z-index: 5; pointer-events: none; text-shadow: 0 1px 12px rgba(0,0,0,.5); }
  #title { top: calc(20px + env(safe-area-inset-top, 0px)); left: 24px; font-weight: 500; font-size: 1rem; letter-spacing: -0.01em; }
  #now {
    bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 24px; right: 24px;
    display: flex; justify-content: space-between; font-size: .95rem;
  }
  #hint {
    top: 50%; left: 0; right: 0; text-align: center; font-size: .95rem;
    transform: translateY(-50%); transition: opacity .6s;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="ui" id="title">welcome to my g@l3ri4</div>
<div class="ui" id="hint">mueve el mouse o desliza el dedo</div>
<div class="ui" id="now"><span id="cap"></span><span id="count"></span></div>

<script>
  /* ============================================================
     EDITA ESTA LISTA: una línea por foto, en el orden en que
     se van revelando. (Si todavía tienes "cancion" o "artista"
     en tus líneas, no pasa nada: se ignoran.)
     ============================================================ */
  const FOTOS = [
    { foto: "fotos/foto1.jpg", titulo: "Foto 1" },
    { foto: "fotos/foto2.jpg", titulo: "Foto 2" },
    { foto: "fotos/foto3.jpg", titulo: "Foto 3" },
    { foto: "fotos/foto4.jpg", titulo: "Foto 4" },
    { foto: "fotos/foto5.jpg", titulo: "Foto 5" },
    { foto: "fotos/foto6.jpg", titulo: "Foto 6" }
  ];

  const BRUSH = 0.085;      // tamaño del pincel (proporción de la pantalla)
  const THRESHOLD = 0.95;  // cuánto hay que pintar para pasar a la siguiente foto

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const capEl = document.getElementById("cap");
  const countEl = document.getElementById("count");
  const hint = document.getElementById("hint");
  const tmp = document.createElement("canvas");
  const t = tmp.getContext("2d");

  const n = FOTOS.length;
  const imgs = FOTOS.map(f => {
    const im = new Image();
    im.ok = false;
    im.onload = () => { im.ok = true; resetCover(); };
    im.onerror = () => { im.ok = false; resetCover(); };
    im.src = f.foto;
    return im;
  });

  let W, H, dpr, radius;
  let base = 0, next = n > 1 ? 1 : 0;
  let cache = {};
  let grid, gw, gh, filled, cells;
  let last = null, finishing = false;
  const CELL = 36;

  function makeCover(i) {
    const c = document.createElement("canvas");
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    const g = c.getContext("2d");
    const im = imgs[i];
    if (im.ok && im.naturalWidth) {
      const s = Math.max(c.width / im.naturalWidth, c.height / im.naturalHeight);
      const w = im.naturalWidth * s, h = im.naturalHeight * s;
      g.drawImage(im, (c.width - w) / 2, (c.height - h) / 2, w, h);
    } else {
      g.fillStyle = "#f0f0f0"; g.fillRect(0, 0, c.width, c.height);
      g.fillStyle = "#8a8a8a";
      g.font = (14 * dpr) + "px Inter, system-ui, sans-serif";
      g.textAlign = "center";
      g.fillText("Falta la imagen: " + FOTOS[i].foto, c.width / 2, c.height / 2);
    }
    return c;
  }
  function cover(i) { return cache[i] || (cache[i] = makeCover(i)); }

  function resetGrid() {
    gw = Math.ceil(W / CELL); gh = Math.ceil(H / CELL);
    cells = gw * gh; grid = new Uint8Array(cells); filled = 0;
  }
  function paintBase() {
    ctx.globalAlpha = 1;
    ctx.drawImage(cover(base), 0, 0);
    capEl.textContent = FOTOS[base].titulo || "";
    countEl.textContent = (base + 1) + " / " + n;
  }
  function resetCover() { cache = {}; paintBase(); resetGrid(); }

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    radius = Math.max(48, Math.min(W, H) * BRUSH);
    resetCover();
  }

  function mark(x, y) {
    const r = radius * 0.85;
    const x0 = Math.max(0, Math.floor((x - r) / CELL)), x1 = Math.min(gw - 1, Math.floor((x + r) / CELL));
    const y0 = Math.max(0, Math.floor((y - r) / CELL)), y1 = Math.min(gh - 1, Math.floor((y + r) / CELL));
    for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) {
      const dx = (gx + 0.5) * CELL - x, dy = (gy + 0.5) * CELL - y;
      const k = gy * gw + gx;
      if (dx * dx + dy * dy <= r * r && !grid[k]) { grid[k] = 1; filled++; }
    }
  }

  function stamp(x, y) {
    const r = radius * dpr, size = Math.ceil(r * 2);
    if (tmp.width !== size) { tmp.width = size; tmp.height = size; }
    const px = x * dpr - r, py = y * dpr - r;
    t.globalCompositeOperation = "source-over";
    t.clearRect(0, 0, size, size);
    t.drawImage(cover(next), px, py, size, size, 0, 0, size, size);
    t.globalCompositeOperation = "destination-in";
    const g = t.createRadialGradient(r, r, r * 0.35, r, r, r);
    g.addColorStop(0, "rgba(0,0,0,1)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    t.fillStyle = g; t.fillRect(0, 0, size, size);
    ctx.drawImage(tmp, px, py);
    mark(x, y);
  }

  function finish() {
    finishing = true;
    const start = performance.now();
    (function step(now) {
      const p = Math.min(1, (now - start) / 900);
      const a = p * p * (3 - 2 * p);   // entrada y salida suaves
      ctx.globalAlpha = a;
      ctx.drawImage(cover(next), 0, 0);
      ctx.globalAlpha = 1;
      if (p < 1) return requestAnimationFrame(step);
      base = next; next = (next + 1) % n;
      const keep = cache[base];
      cache = {}; cache[base] = keep;
      resetGrid(); paintBase();
      finishing = false; last = null;
    })(start);
  }

  function paint(x, y) {
    if (finishing || n < 2) return;
    if (!hint.classList.contains("gone")) hint.classList.add("gone");
    if (last) {
      const dx = x - last.x, dy = y - last.y;
      const dist = Math.hypot(dx, dy), step = radius * 0.25;
      const steps = Math.max(1, Math.floor(dist / step));
      for (let s = 1; s <= steps; s++) stamp(last.x + dx * s / steps, last.y + dy * s / steps);
    } else {
      stamp(x, y);
    }
    last = { x, y };
    if (filled / cells >= THRESHOLD) finish();
  }

  window.addEventListener("pointermove", e => paint(e.clientX, e.clientY));
  window.addEventListener("pointerdown", e => { last = null; paint(e.clientX, e.clientY); });
  window.addEventListener("pointerup", () => { last = null; });
  window.addEventListener("pointerleave", () => { last = null; });
  window.addEventListener("resize", resize);
  resize();
</script>
</body>
</html>
