<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>welcome to my g@l3ri4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #fff; color: #fff;
    font-family: "Inter", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; z-index: 5; pointer-events: none; text-shadow: 0 1px 12px rgba(0,0,0,.5); }
  #title { top: calc(20px + env(safe-area-inset-top, 0px)); left: 24px; font-weight: 500; font-size: 1rem; letter-spacing: -0.01em; }
  #cap { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 24px; font-size: .95rem; }
  #hint {
    top: 50%; left: 0; right: 0; text-align: center; font-size: 1.4rem; font-weight: 500;
    letter-spacing: -0.01em; transform: translateY(-50%); transition: opacity .6s;
  }
  #hint.gone { opacity: 0; }
  #next {
    position: fixed; z-index: 6;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px)); right: 12px;
    background: none; border: 0; color: #fff; font: inherit; font-size: .95rem;
    padding: 12px; cursor: pointer; text-shadow: 0 1px 12px rgba(0,0,0,.5);
  }
  #next:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  /* vista previa del pincel (solo con mouse) */
  #cursor {
    position: fixed; z-index: 4; left: 0; top: 0; pointer-events: none; display: none !important;
    border-radius: 50%; border: 2px solid #fff; background-size: cover; background-position: center;
    box-shadow: 0 0 0 1px rgba(0,0,0,.2);
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="cursor"></div>
<div class="ui" id="title">welcome to my g@l3ri4</div>
<div class="ui" id="hint">draw with your finger</div>
<div class="ui" id="cap"></div>
<div id="err" style="position:fixed;z-index:9;left:12px;right:12px;top:60px;background:#fff;color:#c00;font:13px/1.4 monospace;padding:10px;display:none;white-space:pre-wrap"></div>
<button id="next" type="button">next photo →</button>

<script>
  window.addEventListener("error", e => {
    const b = document.getElementById("err");
    if (b) { b.style.display = "block"; b.textContent = "Error: " + e.message + " (línea " + e.lineno + ")"; }
  });
  /* ============================================================
     AQUÍ VAN TUS FOTOS: una por línea, sin comas ni llaves.
     La primera es el fondo; las demás son tu pincel.
     Para añadir una foto, agrega una línea nueva con su ruta.
     (Opcional: después de la ruta puedes poner " | Título".)
     ============================================================ */
  const LISTA = `
fotos/si.jpg
fotos/monos.jpg
fotos/wu.jpg
fotos/yay.jpg
fotos/waaa.jpg
fotos/portal.jpg
fotos/wi.JPEG
`;

  const FOTOS = LISTA.split("\n").map(l => l.trim()).filter(Boolean).map(l => {
    const [foto, titulo] = l.split("|").map(x => x.trim());
    return { foto, titulo: titulo || foto.replace(/^.*\//, "").replace(/\.[^.]+$/, "") };
  });

  const BRUSH = 0.085;   // tamaño del pincel (proporción de la pantalla)

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const capEl = document.getElementById("cap");
  const hint = document.getElementById("hint");
  const nextBtn = document.getElementById("next");
  const cursorEl = document.getElementById("cursor");
  const tmp = document.createElement("canvas");
  const t = tmp.getContext("2d");

  const n = FOTOS.length;
  const imgs = FOTOS.map(f => {
    const im = new Image();
    im.ok = false;
    im.onload = () => { im.ok = true; cache = {}; if (!painted) draw0(); };
    im.onerror = () => { im.ok = false; cache = {}; if (!painted) draw0(); };
    im.src = f.foto;
    return im;
  });

  let W, H, dpr, radius;
  let brush = n > 1 ? 1 : 0;
  let cache = {};
  let last = null, painted = false;
  let down = null;   // para distinguir un toque rápido de un arrastre

  function makeCover(i) {
    const c = document.createElement("canvas");
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    const g = c.getContext("2d");
    const im = imgs[i];
    if (im.ok && im.naturalWidth) {
      const s = Math.max(c.width / im.naturalWidth, c.height / im.naturalHeight);
      const w = im.naturalWidth * s, h = im.naturalHeight * s;
      g.drawImage(im, (c.width - w) / 2, (c.height - h) / 2, w, h);
    } else {
      g.fillStyle = "#f0f0f0"; g.fillRect(0, 0, c.width, c.height);
      g.fillStyle = "#8a8a8a";
      g.font = (14 * dpr) + "px Inter, system-ui, sans-serif";
      g.textAlign = "center";
      g.fillText("Falta la imagen: " + FOTOS[i].foto, c.width / 2, c.height / 2);
    }
    return c;
  }
  function cover(i) { return cache[i] || (cache[i] = makeCover(i)); }

  function draw0() { ctx.globalAlpha = 1; ctx.drawImage(cover(0), 0, 0); }

  function setBrush(i) {
    brush = (i + n) % n;
    capEl.textContent = FOTOS[brush].titulo || "";
    cursorEl.style.backgroundImage = "url('" + FOTOS[brush].foto + "')";
    last = null;
  }

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    radius = Math.max(48, Math.min(W, H) * BRUSH);
    const d = Math.round(radius * 1.3);
    cursorEl.style.width = cursorEl.style.height = d + "px";
    cache = {}; painted = false; draw0();
  }

  function stamp(x, y) {
    const r = radius * dpr, size = Math.ceil(r * 2);
    if (tmp.width !== size) { tmp.width = size; tmp.height = size; }
    const px = x * dpr - r, py = y * dpr - r;
    t.globalCompositeOperation = "source-over";
    t.clearRect(0, 0, size, size);
    t.drawImage(cover(brush), px, py, size, size, 0, 0, size, size);
    t.globalCompositeOperation = "destination-in";
    const g = t.createRadialGradient(r, r, r * 0.35, r, r, r);
    g.addColorStop(0, "rgba(0,0,0,1)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    t.fillStyle = g; t.fillRect(0, 0, size, size);
    ctx.drawImage(tmp, px, py);
  }

  function paint(x, y) {
    if (n < 2) return;
    painted = true;
    if (!hint.classList.contains("gone")) hint.classList.add("gone");
    if (last) {
      const dx = x - last.x, dy = y - last.y;
      const dist = Math.hypot(dx, dy), step = radius * 0.25;
      const steps = Math.max(1, Math.floor(dist / step));
      for (let s = 1; s <= steps; s++) stamp(last.x + dx * s / steps, last.y + dy * s / steps);
    } else {
      stamp(x, y);
    }
    last = { x, y };
  }

  const onButton = e => e.target.closest && e.target.closest("#next");

  window.addEventListener("pointermove", e => {
    if (onButton(e)) { cursorEl.style.display = "none"; return; }
    if (e.pointerType === "mouse") {
      cursorEl.style.display = "block";
      cursorEl.style.transform = "translate(" + (e.clientX - radius * 0.65) + "px," + (e.clientY - radius * 0.65) + "px)";
    }
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10) down.moved = true;
    paint(e.clientX, e.clientY);
  });
  window.addEventListener("pointerdown", e => {
    if (onButton(e)) return;
    last = null;
    down = { x: e.clientX, y: e.clientY, moved: false };
  });
  window.addEventListener("pointerup", e => {
    // un toque o clic rápido, sin arrastrar, cambia la foto-pincel
    if (down && !down.moved && !onButton(e)) setBrush(brush + 1);
    down = null; last = null;
  });
  window.addEventListener("pointercancel", () => { down = null; last = null; });
  document.addEventListener("pointerleave", () => { cursorEl.style.display = "none"; last = null; });

  nextBtn.addEventListener("click", () => setBrush(brush + 1));
  window.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === " ") setBrush(brush + 1);
    if (e.key === "ArrowLeft") setBrush(brush - 1);
  });
  window.addEventListener("resize", resize);

  resize();
  setBrush(brush);
</script>
</body>
</html>
